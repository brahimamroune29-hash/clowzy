# Scheduled every 30 minutes, but GitHub starts scheduled runs late or drops them (3-6 h apart on 2026-10-03/04):
# the external monitor on / and /api/cron/health is the timely alarm; this is the backup check.
# 1,488 one-minute runs in a 31-day month leave room in the 2,000 included minutes for backups and CI.
# Failed runs appear in Actions; email delivery depends on the owner's GitHub notification settings.
name: uptime
run-name: ${{ inputs.test_alert && 'TEST ONLY - alert delivery' || 'Production availability' }}
on:
  schedule: [{ cron: '27,57 * * * *' }]
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Intentionally fail to test the owner notification; does not affect the site.'
        type: boolean
        default: false
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Intentional notification test (not a production outage)
        if: '${{ inputs.test_alert }}'
        run: |
          echo '::error::TEST ONLY: notification delivery check. The application has not been stopped or changed.'
          exit 1
      - name: Site, database, and search processing are healthy
        env:
          APP_URL: "${{ vars.APP_URL || 'https://app.clowzy.io' }}"
          CRON_SECRET: '${{ secrets.CRON_SECRET }}'
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$1"; }
          test "$(code "$APP_URL/")" = 200
          # 410 is a healthy platform refusing an expired invitation. 503 is the owner's lock
          # (PLATFORM_LOCKED): a platform stopped on purpose is not an outage, and while it is locked the
          # search worker is stopped too, so the processing check below would fail by design.
          probe=$(code "$APP_URL/api/invitation?token=000000000000000000000000000000000000000000000000")
          test "$probe" = 410 || test "$probe" = 503
          if [ "$probe" = 503 ]; then echo 'Platform locked by its owner; skipping the search-processing check.'; exit 0; fi
          test -n "$CRON_SECRET"
          curl -fsS --max-time 30 --retry 2 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/health"
