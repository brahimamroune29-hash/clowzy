# Hourly: the site answers, and the API reaches the database (a well-formed unknown invitation is a 410 only then).
# Failed runs appear in Actions; email delivery depends on the owner's GitHub notification settings.
name: uptime
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Site and database answer
        env: { APP_URL: "${{ vars.APP_URL || 'https://app.clowzy.io' }}" }
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$1"; }
          test "$(code "$APP_URL/")" = 200
          test "$(code "$APP_URL/api/invitation?token=000000000000000000000000000000000000000000000000")" = 410
